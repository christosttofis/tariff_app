# OWASP ZAP attack test against a throwaway copy of the app on GitHub's machine.
# Fake demo data only (seed_demo_data.py), email off, a random signing key per run.
# Needs no secrets and never sees tariff-api/.env. ZAP only targets 127.0.0.1 here.
# Fails only on High-risk alerts; everything else is in the summary and the reports.
name: ZAP scan

on:
  schedule:
    - cron: "30 6 * * 1"   # Mondays 06:30 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap:
    name: ZAP (visitor, supplier, admin)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version: "3.14"

      - name: Install the app
        run: pip install -r tariff-api/requirements.txt

      - name: Start a throwaway copy with fake demo data
        run: |
          # Settings first: the app (and the seed script, which imports it) refuses to
          # start without a signing key. The key is random per run and never stored.
          export DATABASE_URL="sqlite:////tmp/ci.db"
          export TARIFF_SECRET_KEY="$(openssl rand -hex 32)"
          export TARIFF_ENABLE_DOCS=1
          export TARIFF_ADMIN_ALLOWED_NETWORKS=""
          export AZURE_TENANT_ID="" AZURE_CLIENT_ID="" AZURE_CLIENT_SECRET=""
          export TARIFF_EMAIL_FROM="" TARIFF_ADMIN_EMAIL=""
          python tariff-api/seed_demo_data.py /tmp/ci.db
          nohup python .github/scripts/ci_server.py > /tmp/app.log 2>&1 &
          for i in $(seq 60); do curl -sf http://127.0.0.1:8002/customer.html > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8002/customer.html > /dev/null || { cat /tmp/app.log; exit 1; }

      - name: Start ZAP (local to this machine only)
        run: |
          echo "ZAP_KEY=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          source "$GITHUB_ENV"
          # --shm-size: ZAP's DOM XSS rule drives a headless browser in the container;
          # with Docker's default 64 MB of shared memory it crashed ZAP mid-scan.
          docker run -d --name zap --network host --shm-size=2g zaproxy/zap-stable:2.17.0 \
            zap.sh -daemon -silent -host 127.0.0.1 -port 8090 -config api.key="$ZAP_KEY"

      - name: Use the app as visitor, supplier and admin through ZAP, then attack it
        env:
          ZAP_MAX_SCAN_MIN: "110"   # a full active scan of ~200 recorded requests; 35 min only reached ~30%
        run: python .github/scripts/zap_scan.py http://127.0.0.1:8002 http://127.0.0.1:8090 "$ZAP_KEY" zap-out

      - name: ZAP log (for troubleshooting)
        if: failure()
        run: |
          docker inspect zap --format 'ZAP container: running={{.State.Running}} oom_killed={{.State.OOMKilled}} exit_code={{.State.ExitCode}}' || true
          free -m || true
          docker logs zap 2>&1 | tail -n 80

      - name: Pass/fail on High-risk alerts
        run: python .github/scripts/zap_gate.py zap-out

      - name: App log (for troubleshooting)
        if: always()
        run: tail -n 100 /tmp/app.log || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        if: always()
        with:
          name: zap-reports
          path: zap-out/
          retention-days: 30
