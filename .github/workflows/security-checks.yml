# Quick security checks: libraries, code patterns, secrets.
# Runs on GitHub's throwaway Linux machines; needs no secrets and never sees tariff-api/.env.
# Fails only on: any known library vulnerability, any secret, high-severity bandit,
# ERROR-severity semgrep. Everything else is reported in the downloadable artifacts.
name: Security checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC: catches newly published library vulnerabilities
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    name: Library vulnerabilities (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version: "3.14"
      - run: pip install pip-audit==2.10.1
      - name: Audit app requirements
        run: pip-audit -r tariff-api/requirements.txt --desc
      - name: Audit dev/test requirements
        run: pip-audit -r tariff-api/requirements-dev.txt --desc

  code-python:
    name: Python code (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version: "3.14"
      - run: pip install bandit==1.9.4
      - name: Full report (all severities)
        run: bandit -r tariff-api -x tariff-api/migrations -f txt -o bandit-report.txt --exit-zero
      - name: Fail on high severity
        run: bandit -r tariff-api -x tariff-api/migrations --severity-level high
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        if: always()
        with:
          name: bandit-report
          path: bandit-report.txt
          retention-days: 30

  code-patterns:
    name: Code patterns (semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.179.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - name: Full report (all severities)
        run: >
          semgrep scan --metrics=off
          --config p/python --config p/owasp-top-ten --config p/javascript
          --json -o semgrep-report.json .
      - name: Fail on ERROR severity
        run: >
          semgrep scan --metrics=off
          --config p/python --config p/owasp-top-ten --config p/javascript
          --severity ERROR --error .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        if: always()
        with:
          name: semgrep-report
          path: semgrep-report.json
          retention-days: 30

  secrets:
    name: Secrets in git history (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0   # the whole history, not just the latest commit
      - name: Download gitleaks and verify its checksum
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" gitleaks
      - name: Scan every commit (values redacted in output)
        run: ./gitleaks git . --redact --no-banner --log-opts="--all"
