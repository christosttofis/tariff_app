# ZAP Automation Framework plan, run once per role by .github/workflows/zap-scan.yml.
# ${ZAP_ROLE} and ${ZAP_COOKIE} come from the environment (visitor / supplier / admin).
env:
  contexts:
    - name: tariff
      urls:
        - "http://127.0.0.1:8002"
      includePaths:
        - "http://127.0.0.1:8002.*"
      excludePaths:
        # Would end the scan's own session (or need the real current password anyway)
        - "http://127.0.0.1:8002/api/auth/logout.*"
        - "http://127.0.0.1:8002/api/auth/password.*"
        - "http://127.0.0.1:8002/api/auth/email.*"
  parameters:
    failOnError: true
    failOnWarning: false
    progressToStdout: true

jobs:
  # Every request carries this role's session cookie (a dummy one for the visitor run)
  - type: replacer
    parameters:
      deleteAllRules: true
    rules:
      - description: "Session cookie for ${ZAP_ROLE}"
        matchType: req_header
        matchString: Cookie
        replacementString: "${ZAP_COOKIE}"

  - type: openapi
    parameters:
      apiUrl: "http://127.0.0.1:8002/openapi.json"
      context: tariff

  - type: spider
    parameters:
      context: tariff
      url: "http://127.0.0.1:8002/customer.html"
      maxDuration: 2

  - type: passiveScan-wait
    parameters:
      maxDuration: 5

  - type: activeScan
    parameters:
      context: tariff
      maxScanDurationInMins: 15
      maxRuleDurationInMins: 3
      threadPerHost: 4

  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk
      reportFile: "zap-${ZAP_ROLE}"
  - type: report
    parameters:
      template: traditional-html
      reportDir: /zap/wrk
      reportFile: "zap-${ZAP_ROLE}"
